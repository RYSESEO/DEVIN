  # ── Streaming ─────────────────────────────────────────────────────
  - domain: netflix.com
    name: Netflix
    category: streaming
    billing_model: auto_renew
    trial_policy: {duration_days: 0, auto_converts: false, note: "Netflix no longer offers free trials."}
    refund_policy: {window_days: 0, partial_allowed: false, note: "No refunds. Access continues until end of billing period."}
    legal_flags: ["CA_ARL", "FTC_ROSCA"]
    contacts:
      - channel: web
        target: "https://help.netflix.com"
        auth_required: false
        notes: "Help center with chat option for logged-in users."
      - channel: chat
        target: "https://help.netflix.com/en/contactus"
        hours: "24/7"
        expected_hold_minutes: 2
        auth_required: true
    paths:
      - path_type: cancel
        method: web
        estimated_time_seconds: 120
        difficulty: easy
        confidence: 0.97
        notes: "Access continues until end of billing period."
        last_verified_at: "2026-05-01T00:00:00Z"
        steps:
          - action: navigate
            target: "https://www.netflix.com/account"
            description: "Go to your Netflix Account page and sign in."
          - action: click
            target: "Manage Membership"
            description: "Click 'Manage Membership' under your plan details."
          - action: click
            target: "Cancel"
            description: "Click 'Cancel'."
          - action: click
            target: "Finish Cancellation"
            description: "Click 'Finish Cancellation' to confirm."
      - path_type: pause
        method: web
        estimated_time_seconds: 90
        difficulty: easy
        confidence: 0.93
        notes: "Pause for 1, 2, or 3 months. No charge during pause. Resumes automatically."
        last_verified_at: "2026-05-01T00:00:00Z"
        steps:
          - action: navigate
            target: "https://www.netflix.com/account"
            description: "Go to your Netflix Account page."
          - action: click
            target: "Manage Membership"
            description: "Click 'Manage Membership'."
          - action: click
            target: "Pause Membership"
            description: "Select 'Pause Membership' and choose duration."
      - path_type: downgrade
        method: web
        estimated_time_seconds: 90
        difficulty: easy
        confidence: 0.95
        notes: "Switch to a lower-priced plan. Change takes effect next billing cycle."
        last_verified_at: "2026-05-01T00:00:00Z"
        steps:
          - action: navigate
            target: "https://www.netflix.com/account"
            description: "Go to your Netflix Account page."
          - action: click
            target: "Change Plan"
            description: "Click 'Change Plan'."
          - action: click
            target: "lower_tier"
            description: "Select a lower-priced plan and confirm."

